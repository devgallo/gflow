<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="switch-container">
      <span>Modo noturno</span>
      <input type="checkbox" id="switch" class="switch-input">
      <label for="switch" class="switch-label"></label>
    </div>
  </div>

  <!-- AGENTE -->
  <div class="card">
    <span class="label">👤 Agente</span>
    <span id="agent" class="value">-</span>
  </div>

  <!-- STATUS -->
  <div class="card">
    <span class="label">💬 Status</span>
    <div class="status-box">
      <span id="statusDot" class="dot"></span>
      <span id="statusText" class="value">-</span>
    </div>
  </div>

  <!-- SATISFAÇÃO -->
  <div class="card">
    <span class="label">📊 Satisfação</span>
    <span id="satisfaction" class="value">-</span>
  </div>

  <!-- CONVERSÃO -->
  <div class="card">
    <span class="label">⚡ Conversão</span>
    <span id="conversion" class="value">-</span>
  </div>

  <!-- ALERTA -->
  <div class="card">
    <label class="toggle">
      <span id="bell" class="bell">🔔</span>
      <input type="checkbox" id="toggleAlert">
      <span>Notificar quando offline na fila</span>
    </label>
  </div>
    <!-- SOM -->
<div class="card config-card">

  <div class="config-header">
    🔊 Som da notificação
  </div>

  <div class="sound-options-modern">

    <label class="radio-card">
      <input type="radio" name="alertSound" value="alert">
      <span>Bomb</span>
    </label>

    <label class="radio-card">
      <input type="radio" name="alertSound" value="soft">
      <span>Clean</span>
    </label>

    <label class="radio-card">
      <input type="radio" name="alertSound" value="tech">
      <span>Light</span>
    </label>

  </div>

  <div class="volume-box">
    <div class="volume-header">
      <span>Volume</span>
      <span id="volumeValue">50%</span>
    </div>

    <input type="range" id="volumeControl" min="0" max="1" step="0.01">
  </div>



</div>

<!-- FOOTER -->
<div class="footer">
  <span class="logo-tech">GFlow v1.0</span>
</div>

<script src="popup.js"></script>
</body>
</html>
